global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # CORRECTIF : manquant - sans ça les métriques métier de Personne C
  # (records traités, durée des jobs, taux de succès) n'apparaissent jamais dans Grafana
  - job_name: datalake-custom-metrics
    static_configs:
      - targets: ["custom-metrics:9200"]

  - job_name: spark-master
    metrics_path: /metrics/master/prometheus/
    static_configs:
      - targets: ["spark-master:8080"]