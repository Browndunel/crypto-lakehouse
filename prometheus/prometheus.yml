global:
  scrape_interval: 30s
  scrape_timeout: 25s

scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: crypto-metrics
    static_configs:
      - targets: ["metrics:8000"]